<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>General Trading Company – Concept Redesign</title>
<style>
:root{--bg:#f6f7f9;--sf:#fff;--tx:#14202e;--mu:#5b6878;--br:#0b4f7c;--ac:#e8a317;--ln:#e2e6ec;--ch:#eaf2f8;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141b;--sf:#16202b;--tx:#e8edf3;--mu:#9aa8b8;--br:#5fb0e6;--ac:#f0b83a;--ln:#263444;--ch:#1c2b3a;--on:#0e141b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e141b;--sf:#16202b;--tx:#e8edf3;--mu:#9aa8b8;--br:#5fb0e6;--ac:#f0b83a;--ln:#263444;--ch:#1c2b3a;--on:#0e141b;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif}
a{color:inherit}.w{max-width:1120px;margin:0 auto;padding:0 20px}button{font:inherit;cursor:pointer}
.bn{background:var(--ac);color:#1a1a1a;font-size:13px;text-align:center;padding:7px 14px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sf);border-bottom:1px solid var(--ln)}
.bar{display:flex;align-items:center;justify-content:space-between;height:68px;gap:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.mk{width:40px;height:40px;border-radius:10px;background:var(--br);color:var(--on);display:grid;place-items:center;font-weight:900;font-size:15px;border-bottom:4px solid var(--ac)}
.lt b{display:block;font-size:17px;line-height:1.1;color:var(--br)}.lt small{font-size:10.5px;color:var(--mu);letter-spacing:.04em}
nav>ul{display:flex;gap:4px;list-style:none;margin:0;padding:0}nav a{text-decoration:none;font-weight:500;color:var(--mu);padding:8px 11px;border-radius:8px;display:block}
nav a:hover,nav a.on{color:var(--br);background:var(--ch)}
.dd{position:relative}.sub{display:none;position:absolute;top:100%;inset-inline-start:0;min-width:270px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:8px;list-style:none;margin:0;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.dd:hover .sub,.dd:focus-within .sub{display:block}.sub a{padding:7px 10px;font-size:14.5px}
.tl{display:flex;gap:6px}.ib{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:10px;min-width:40px;height:40px;padding:0 8px}#mn{display:none}
.bt{background:var(--br);color:var(--on);border:0;border-radius:10px;padding:11px 20px;font-weight:600;text-decoration:none;display:inline-block}
.bt.al{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.hero{padding:76px 0 56px;background:linear-gradient(135deg,var(--ch),var(--bg))}
h1{font-size:clamp(28px,4.6vw,48px);line-height:1.18;margin:0 0 14px}h2{font-size:clamp(22px,3.2vw,32px);margin:0 0 8px}
.lead{font-size:18px;color:var(--mu);max-width:660px;margin:0 0 24px}.row{display:flex;gap:12px;flex-wrap:wrap}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:38px}
.cd{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:20px}.cd h3{margin:0 0 6px;font-size:17px}.cd p{margin:0;color:var(--mu);font-size:14.5px}
a.cd{text-decoration:none;display:block}a.cd:hover{border-color:var(--br)}.st b{display:block;font-size:26px;color:var(--br)}.st span{color:var(--mu);font-size:14px}
section{padding:50px 0}.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.bc{font-size:14px;color:var(--mu);margin-bottom:14px}.bc a{color:var(--br);text-decoration:none}
.pg{padding:40px 0 60px}.pg p{max-width:760px}.bd{display:inline-block;background:var(--ch);color:var(--mu);font-size:12px;border-radius:6px;padding:3px 9px;margin-bottom:14px}
input,select,textarea{font:inherit;width:100%;padding:12px 14px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx)}
.fl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.fl input{flex:2 1 230px}.fl select{flex:1 1 150px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.chip{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:99px;padding:6px 14px;font-size:14px}
.chip[aria-pressed=true]{background:var(--br);color:var(--on);border-color:var(--br)}
.jb{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}.job{display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.tag{display:inline-block;background:var(--ch);color:var(--br);font-size:12px;font-weight:600;border-radius:6px;padding:3px 8px}.job h3{margin:8px 0 0}.job small{color:var(--mu)}
.ja{display:flex;gap:8px;align-items:center}.ja .bt{flex:1;text-align:center}.sv{font-size:18px;padding:0 12px}.sv[aria-pressed=true]{color:var(--ac)}
.ct{color:var(--mu);font-size:14px;margin:0 0 12px}.em{text-align:center;color:var(--mu);padding:26px}
dialog{border:0;border-radius:14px;padding:0;max-width:480px;width:calc(100% - 28px);background:var(--sf);color:var(--tx);max-height:92vh}dialog::backdrop{background:rgba(0,0,0,.55)}
form,.ok{padding:22px;display:grid;gap:12px}form h3{margin:0}label{font-size:14px;font-weight:600;display:grid;gap:5px}.er{color:#d33;font-size:13px;font-weight:400}.nt{font-size:12px;color:var(--mu)}
#sr a{display:block;padding:10px 6px;border-bottom:1px solid var(--ln);text-decoration:none}#sr small{color:var(--mu)}
.cg{display:grid;grid-template-columns:1fr 1.2fr;gap:30px}
footer{background:var(--sf);border-top:1px solid var(--ln);padding:34px 0;color:var(--mu);font-size:14px}footer .w{display:grid;grid-template-columns:2fr 1fr 1fr;gap:24px}footer a{display:block;text-decoration:none;padding:2px 0}
@media(max-width:900px){#mn{display:block}.cg,footer .w{grid-template-columns:1fr}.lt small{display:none}
nav{display:none;position:absolute;inset-inline:0;top:68px;background:var(--sf);border-bottom:1px solid var(--ln);padding:8px 20px 16px;max-height:75vh;overflow:auto}nav.open{display:block}
nav>ul{flex-direction:column}.sub{display:block;position:static;border:0;box-shadow:none;padding:0 14px;min-width:0}.hero{padding:44px 0 34px}section{padding:36px 0}}
</style>
</head>
<body>
<div class="bn" id="bn"></div>
<header><div class="w bar">
<a class="logo" href="#home" aria-label="GTC"><span class="mk">GTC</span><span class="lt"><b>General Trading Company</b><small>KUWAIT · SINCE 1959</small></span></a>
<nav id="nv" aria-label="Main"></nav>
<div class="tl"><button class="ib" id="bs" aria-label="Search">⌕</button><button class="ib" id="bl" aria-label="Language">عربي</button><button class="ib" id="bt" aria-label="Theme">◐</button><button class="ib" id="mn" aria-label="Menu" aria-expanded="false">☰</button></div>
</div></header>
<main id="app"></main>
<footer><div class="w" id="ft"></div></footer>
<dialog id="dg"><div id="db"></div></dialog>
<dialog id="ds"><div style="padding:18px"><input id="sq" type="search" autocomplete="off"><div id="sr" aria-live="polite" style="max-height:60vh;overflow:auto;margin-top:8px"></div><button class="bt al" id="sx" style="margin-top:10px" type="button">✕</button></div></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const st={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang=st.get("lg","en");
const S={en:{home:"Home",about:"About",services:"Services",careers:"Careers",contact:"Contact",bn:"Unofficial concept redesign, created as a proposal. Not affiliated with or published by General Trading Company.",sp:"Search the site",roles:"Open roles",apply:"Apply",done:"Applied ✓",sv:"Save",nm:"No matching results.",rf:"role(s) found",all:"All fields",az:"Sort: A to Z",za:"Sort: Z to A",saved:"★ Saved",fn:"Full name",em:"Email",ph:"Phone",cv:"CV (PDF or Word)",cn:"Cover note (optional)",sub:"Submit application",can:"Cancel",thx:"Thank you",dn:"Demo form: nothing is sent. Only an “applied” marker is kept on this device.",rq:"This field is required.",ie:"Enter a valid email.",ip:"Enter a valid phone number.",ac:"Please attach your CV.",tb:"File must be under 5 MB.",ms:"Message",send:"Send message",ex:"Explore",rel:"Related pages",dr:"Draft copy: to be replaced with GTC’s approved text",np:"No posts published yet.",h1:"Build your career with one of Kuwait’s leading companies",h2:"Our divisions",h3:"Browse open roles",cr:"Ready to join us?",cs:"Browse roles by field, save your favourites and apply in under two minutes.",ct:"Get in touch",cte:"Questions about a role or a service? Write to us at",sent:"Your message would be received here. (Demo only.)",est:"Established in Kuwait",dv:"Service divisions",rt:"Role types hiring",ft:"Concept design for discussion only. © General Trading Company.",fixed:"The old job-listing plugin is replaced by a built-in job board, so listings, search and applications work everywhere."},
ar:{home:"الرئيسية",about:"من نحن",services:"الخدمات",careers:"الوظائف",contact:"اتصل بنا",bn:"تصميم مفاهيمي غير رسمي مقدَّم كاقتراح، وغير تابع لشركة التجارة العامة.",sp:"ابحث في الموقع",roles:"الوظائف المتاحة",apply:"تقدّم",done:"تم التقديم ✓",sv:"حفظ",nm:"لا توجد نتائج مطابقة.",rf:"وظيفة",all:"كل المجالات",az:"ترتيب أبجدي",za:"ترتيب عكسي",saved:"★ المحفوظة",fn:"الاسم الكامل",em:"البريد الإلكتروني",ph:"الهاتف",cv:"السيرة الذاتية (PDF أو Word)",cn:"رسالة مرافقة (اختياري)",sub:"إرسال الطلب",can:"إلغاء",thx:"شكراً",dn:"نموذج تجريبي: لا يتم إرسال أي بيانات. يُحفظ فقط وسم «تم التقديم» على هذا الجهاز.",rq:"هذا الحقل مطلوب.",ie:"أدخل بريداً إلكترونياً صحيحاً.",ip:"أدخل رقم هاتف صحيحاً.",ac:"يرجى إرفاق سيرتك الذاتية.",tb:"يجب ألا يتجاوز الملف 5 ميغابايت.",ms:"الرسالة",send:"إرسال الرسالة",ex:"استكشف",rel:"صفحات ذات صلة",dr:"نص مسودة: يُستبدل بالنص المعتمد من الشركة",np:"لا توجد منشورات بعد.",h1:"ابنِ مسيرتك المهنية مع إحدى الشركات الرائدة في الكويت",h2:"أقسامنا",h3:"تصفح الوظائف",cr:"هل أنت مستعد للانضمام إلينا؟",cs:"تصفح الوظائف حسب المجال، واحفظ المفضلة وقدّم في أقل من دقيقتين.",ct:"تواصل معنا",cte:"لديك سؤال عن وظيفة أو خدمة؟ راسلنا على",sent:"سيتم استلام رسالتك هنا. (عرض تجريبي فقط.)",est:"تأسست في الكويت",dv:"أقسام الخدمات",rt:"أنواع الوظائف المطلوبة",ft:"تصميم مفاهيمي للنقاش فقط. © شركة التجارة العامة.",fixed:"تم استبدال إضافة الوظائف القديمة بلوحة وظائف مدمجة، فتعمل القوائم والبحث والتقديم بشكل سليم."}};
const T=k=>S[lang][k]||S.en[k]||k;
// id|parent|en|ar|body (r = real text from gtckuwait.com)
const R="Established in 1959, General Trading Company (GTC) has developed into one of the leading companies in Kuwait. GTC operates in industrial catering and services, human resource and recruitment, industrial cleaning and facility management, logistics and warehousing, education, health care, security service and agency facilitation.";
const D="profile|about|Company Profile|ملف الشركة|r\nchairman|about|Chairman’s Message|كلمة رئيس مجلس الإدارة|A message from the Chairman on GTC’s vision and direction.\nobjectives|about|Strategic Objectives|الأهداف الاستراتيجية|GTC’s long-term goals for growth, quality and service.\nstructure|about|Organizational Structure|الهيكل التنظيمي|How GTC’s divisions and leadership are organised.\nquality|about|Quality Assurance & Certificates|ضمان الجودة والشهادات|Quality standards and certifications held by GTC.\ncsr|about|Corporate Social Responsibility|المسؤولية الاجتماعية للشركات|GTC’s commitment to the communities it serves.\nhse|csr|Health, Safety & Environment|الصحة والسلامة والبيئة|Health, safety and environmental practices across GTC operations.\ntraining|csr|Training & Education|التدريب والتعليم|Training and education initiatives for employees and communities.\nevents|about|Events|الفعاليات|Company events and announcements.\nnews|about|News|الأخبار|Latest news from GTC.\nhc|services|Human Capital|رأس المال البشري|Workforce solutions covering manpower outsourcing and talent acquisition.\nmanpower|hc|Manpower Outsourcing|توفير القوى العاملة|Skilled and general workforce supplied to client organisations.\ntalent|hc|Talent Acquisition|استقطاب المواهب|Recruitment services that connect employers with qualified candidates.\ncatering|services|Catering Services|خدمات التموين|Industrial catering for institutions, sites and public-sector clients.\nhospital|catering|Hospital Catering|تموين المستشفيات|Meal services for hospitals and healthcare facilities.\nmilitary|catering|Military & Police Catering|تموين العسكريين والشرطة|Catering for military and police establishments.\ncamp|catering|Remote Camp Site Catering|تموين المخيمات النائية|Catering and camp support for remote work sites.\nschools|catering|Schools & Universities Catering|تموين المدارس والجامعات|Meal services for schools and universities.\npartner|services|International & Local Partnership|الشراكات الدولية والمحلية|Partnership services for international and local businesses.\nagency|partner|Sponsorship & Agency Facilitation|الكفالة وتسهيل الوكالات|Sponsorship and agency facilitation for companies entering Kuwait.\nfranchise|partner|Franchise Retail Branding|العلامات التجارية للامتياز والتجزئة|Franchise and retail branding partnerships.\ngeneral|services|General Services|الخدمات العامة|Facility management and supply chain services.\nfacility|general|Facility Management|إدارة المرافق|Cleaning, maintenance and facility operations.\nsupply|general|Supply Chain|سلسلة الإمداد|Logistics and warehousing services.\nsecurity|services|Security Service|خدمات الأمن|Security services for facilities and sites.\nindustrial|services|Industrial Service|الخدمات الصناعية|Construction, mechanical and electrical contracting.\nconstruction|industrial|Construction & Contracting|الإنشاءات والمقاولات|Construction and contracting works.\nmce|industrial|Mechanical & Electrical Contracting|المقاولات الميكانيكية والكهربائية|Mechanical and electrical contracting works.";
const P={};D.split("\n").forEach(l=>{const[a,b,c,d,e]=l.split("|");P[a]={id:a,par:b,en:c,ar:d,body:e==="r"?R:e,real:e==="r"}});
const nm=id=>id==="home"||id==="careers"||id==="contact"||id==="services"||id==="about"?T(id):P[id][lang==="ar"?"ar":"en"];
const kids=id=>Object.values(P).filter(p=>p.par===id);
const J={Engineering:["Architect","Chemical Engineer","Civil Engineer","Electrical Engineer","HSE Engineer","Industrial Engineer","Mechanical Engineer","Agriculturist"],Technical:["Auto Technician","Boat Mechanics","Boat Maintenance Engineer","Diesel Mechanic","Electrician","Heavy Equipment Operator","Heavy Equipment Technician","Maintenance Fitter","Maintenance Technician","Painter","Welder","A/B Seaman"],"Drivers & Operations":["Heavy Duty Driver","Light Duty Driver","Operations Coordinator","Camp Supervisor","Laundry (Overseer)","Laundry (Supervisor)","Orderly"],"Business & Admin":["Accountant","Administrative Assistant","Clerk","Finance Manager","Information Technologist (I.T)","Lawyer","Procurement Officer","Procurement Manager","Translator"],"Sales & Marketing":["Customer Service Officer","Customer Service Manager","Marketing Officer","Marketing Manager","Public Relations Officer","Sales Associate","Sales Quality Assurance Agent"],"Health & Safety":["Chemist","Nurse","Pharmacist","Quality Control Officer","Safety Officer","Security Officer"],"Education & Other":["Teacher","Tailor (General)"]};
const JOBS=[];for(const c in J)J[c].forEach(t=>JOBS.push({t,c}));
let fc="All",saved=st.get("sv",[]),applied=st.get("ap",[]);
function nav(){const a=(id,c)=>`<a href="#${id}" data-id="${id}">${c||nm(id)}</a>`,sub=(ids)=>`<ul class="sub">${ids.map(i=>`<li>${a(i)}</li>`).join("")}</ul>`;
const ab=Object.values(P).filter(p=>p.par==="about"||p.par==="csr").map(p=>p.id),sv=kids("services").map(p=>p.id);
$("#nv").innerHTML=`<ul><li>${a("home")}</li><li class="dd">${a("profile",T("about"))}${sub(ab)}</li><li class="dd">${a("services")}${sub(sv)}</li><li>${a("careers")}</li><li>${a("contact")}</li></ul>`}
function foot(){$("#ft").innerHTML=`<div><b>General Trading Company</b><p>${T("ft")}</p></div><div><b>${T("services")}</b>${kids("services").map(p=>`<a href="#${p.id}">${nm(p.id)}</a>`).join("")}</div><div><b>${T("about")}</b><a href="#profile">${nm("profile")}</a><a href="#careers">${T("careers")}</a><a href="#contact">${T("contact")}</a><a href="mailto:info@gtckuwait.com">info@gtckuwait.com</a><a href="https://www.linkedin.com/company/general-trading-company-gtc-" rel="noopener">LinkedIn</a></div>`}
const card=id=>`<a class="cd" href="#${id}"><h3>${esc(nm(id))}</h3><p>${esc(P[id].body)}</p></a>`;
function home(){return`<div class="hero"><div class="w"><h1>${T("h1")}</h1><p class="lead">${R.split(".")[0]}.</p><div class="row"><a class="bt" href="#careers">${T("h3")}</a><a class="bt al" href="#profile">${nm("profile")}</a></div>
<div class="st"><div class="cd"><b>1959</b><span>${T("est")}</span></div><div class="cd"><b>${kids("services").length}</b><span>${T("dv")}</span></div><div class="cd"><b>${JOBS.length}</b><span>${T("rt")}</span></div></div></div></div>
<section><div class="w"><h2>${T("h2")}</h2><p class="ct"></p><div class="gr">${kids("services").map(p=>card(p.id)).join("")}</div></div></section>
<section style="background:var(--sf)"><div class="w"><h2>${T("cr")}</h2><p class="lead">${T("cs")}</p><a class="bt" href="#careers">${T("h3")}</a></div></section>`}
function inner(id){const p=P[id],ch=kids(id),sib=Object.values(P).filter(x=>x.par===p.par&&x.id!==id);
const bc=`<a href="#home">${T("home")}</a> › `+(p.par&&P[p.par]?`<a href="#${p.par}">${nm(p.par)}</a> › `:p.par==="services"?`<a href="#services">${T("services")}</a> › `:"")+esc(nm(id));
const empty=(id==="news"||id==="events")?`<div class="cd em">${T("np")}</div>`:"";
return`<div class="pg"><div class="w"><div class="bc">${bc}</div><h1>${esc(nm(id))}</h1>${p.real?"":`<span class="bd">${T("dr")}</span>`}<p class="lead">${esc(p.body)}</p>${empty}
${ch.length?`<div class="gr" style="margin-top:20px">${ch.map(c=>card(c.id)).join("")}</div>`:""}
${sib.length?`<h2 style="margin-top:36px;font-size:20px">${T("rel")}</h2><div class="gr">${sib.slice(0,6).map(c=>card(c.id)).join("")}</div>`:""}
<div class="row" style="margin-top:30px"><a class="bt" href="#contact">${T("ct")}</a><a class="bt al" href="#careers">${T("careers")}</a></div></div></div>`}
function svc(){return`<div class="pg"><div class="w"><div class="bc"><a href="#home">${T("home")}</a> › ${T("services")}</div><h1>${T("services")}</h1><p class="lead">${R}</p><div class="gr">${kids("services").map(p=>card(p.id)).join("")}</div></div></div>`}
function careers(){return`<div class="pg"><div class="w"><div class="bc"><a href="#home">${T("home")}</a> › ${T("careers")}</div><h1>${T("roles")}</h1><p class="ct">${T("fixed")}</p>
<div class="fl"><input id="q" type="search" placeholder="${T("sp")}" aria-label="${T("sp")}"><select id="so"><option value="az">${T("az")}</option><option value="za">${T("za")}</option></select></div>
<div class="chips" id="cp"></div><p class="ct" id="cn" aria-live="polite"></p><div class="jb" id="jl"></div><div class="cd em" id="je" hidden>${T("nm")}</div></div></div>`}
function jobs(){const cp=$("#cp");[["All",T("all")],["Saved",T("saved")],...Object.keys(J).map(k=>[k,k])].forEach(([k,l])=>{const b=document.createElement("button");b.className="chip";b.textContent=l;b.setAttribute("aria-pressed",k===fc);b.onclick=()=>{fc=k;[...cp.children].forEach(x=>x.setAttribute("aria-pressed",x===b));rj()};cp.appendChild(b)});$("#q").oninput=rj;$("#so").onchange=rj;
$("#jl").onclick=e=>{const a=e.target.closest("[data-a]"),s=e.target.closest("[data-s]");if(a)form(a.dataset.a);if(s){const t=s.dataset.s;saved=saved.includes(t)?saved.filter(x=>x!==t):[...saved,t];st.set("sv",saved);rj()}};rj()}
function rj(){const q=$("#q").value.trim().toLowerCase(),o=$("#so").value;let r=JOBS.filter(j=>(fc==="All"||(fc==="Saved"?saved.includes(j.t):j.c===fc))&&(j.t+j.c).toLowerCase().includes(q)).sort((a,b)=>o==="za"?b.t.localeCompare(a.t):a.t.localeCompare(b.t));
$("#jl").innerHTML=r.map(j=>{const ap=applied.some(x=>x.t===j.t);return`<article class="cd job"><div><span class="tag">${esc(j.c)}</span><h3>${esc(j.t)}</h3><small>Kuwait</small></div><div class="ja"><button class="bt" data-a="${esc(j.t)}" ${ap?"disabled style='opacity:.6'":""}>${ap?T("done"):T("apply")}</button><button class="ib sv" data-s="${esc(j.t)}" aria-pressed="${saved.includes(j.t)}" aria-label="${T("sv")}">${saved.includes(j.t)?"★":"☆"}</button></div></article>`}).join("");
$("#cn").textContent=r.length+" "+T("rf");$("#je").hidden=!!r.length}
function contact(){return`<div class="pg"><div class="w"><div class="bc"><a href="#home">${T("home")}</a> › ${T("contact")}</div><h1>${T("ct")}</h1><div class="cg"><div><p class="lead" style="font-size:16px">${T("cte")} <a href="mailto:info@gtckuwait.com">info@gtckuwait.com</a></p><p><a href="https://www.linkedin.com/company/general-trading-company-gtc-" rel="noopener">LinkedIn</a></p></div>
<form id="cf" class="cd" novalidate><label>${T("fn")}<input name="n" autocomplete="name" required><span class="er"></span></label><label>${T("em")}<input name="e" type="email" autocomplete="email" required><span class="er"></span></label><label>${T("ms")}<textarea name="m" rows="4" required></textarea><span class="er"></span></label><p class="nt">${T("dn")}</p><button class="bt" type="submit">${T("send")}</button></form></div></div></div>`}
function chk(f){let ok=true;f.querySelectorAll("[required]").forEach(i=>{const er=i.nextElementSibling;let m="";
if(i.type==="file"){if(!i.files.length)m=T("ac");else if(i.files[0].size>5242880)m=T("tb")}else if(!i.value.trim())m=T("rq");else if(i.type==="email"&&!/^\S+@\S+\.\S+$/.test(i.value))m=T("ie");else if(i.type==="tel"&&!/^[+\d][\d\s-]{6,}$/.test(i.value))m=T("ip");
if(er)er.textContent=m;if(m)ok=false});return ok}
function bindContact(){$("#cf").onsubmit=e=>{e.preventDefault();if(chk(e.target))e.target.outerHTML=`<div class="cd ok"><h3>${T("thx")}</h3><p>${T("sent")}</p></div>`}}
const dg=$("#dg");
function form(t){$("#db").innerHTML=`<form id="af" novalidate><h3>${T("apply")}: ${esc(t)}</h3><label>${T("fn")}<input name="n" autocomplete="name" required><span class="er"></span></label><label>${T("em")}<input name="e" type="email" autocomplete="email" required><span class="er"></span></label><label>${T("ph")}<input name="p" type="tel" autocomplete="tel" required><span class="er"></span></label><label>${T("cv")}<input name="c" type="file" accept=".pdf,.doc,.docx" required><span class="er"></span></label><label>${T("cn")}<textarea name="m" rows="3"></textarea></label><p class="nt">${T("dn")}</p><div class="row"><button class="bt" type="submit">${T("sub")}</button><button class="bt al" type="button" id="xc">${T("can")}</button></div></form>`;dg.showModal();$("#xc").onclick=()=>dg.close();
$("#af").onsubmit=e=>{e.preventDefault();if(!chk(e.target))return;applied.push({t,d:Date.now()});st.set("ap",applied);$("#db").innerHTML=`<div class="ok"><h3>${T("thx")}, ${esc(e.target.n.value.split(" ")[0])}</h3><p>${esc(t)} ✓</p><button class="bt" id="xd">OK</button></div>`;$("#xd").onclick=()=>{dg.close();if($("#jl"))rj()}}}
dg.addEventListener("click",e=>{if(e.target===dg)dg.close()});
function route(){const id=location.hash.slice(1)||"home",a=$("#app");
if(id==="home")a.innerHTML=home();else if(id==="services")a.innerHTML=svc();else if(id==="careers"){a.innerHTML=careers();jobs()}else if(id==="contact"){a.innerHTML=contact();bindContact()}else if(P[id])a.innerHTML=inner(id);else{location.hash="home";return}
document.title=(id==="home"?"General Trading Company":nm(id))+" – GTC Concept";scrollTo(0,0);$("#nv").classList.remove("open");$("#mn").setAttribute("aria-expanded","false");
document.querySelectorAll("nav a").forEach(x=>x.classList.toggle("on",x.dataset.id===id))}
function setLang(l){lang=l;st.set("lg",l);const r=document.documentElement;r.lang=l;r.dir=l==="ar"?"rtl":"ltr";$("#bl").textContent=l==="ar"?"EN":"عربي";$("#bn").textContent=T("bn");$("#sq").placeholder=T("sp");nav();foot();route()}
$("#mn").onclick=()=>{const o=$("#nv").classList.toggle("open");$("#mn").setAttribute("aria-expanded",o)};
$("#bl").onclick=()=>setLang(lang==="ar"?"en":"ar");
$("#bt").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"};
const ds=$("#ds");$("#bs").onclick=()=>{ds.showModal();$("#sq").focus()};$("#sx").onclick=()=>ds.close();ds.addEventListener("click",e=>{if(e.target===ds)ds.close()});
$("#sq").oninput=()=>{const q=$("#sq").value.trim().toLowerCase();if(!q){$("#sr").innerHTML="";return}
const pr=Object.values(P).filter(p=>(p.en+p.ar+p.body).toLowerCase().includes(q)).map(p=>`<a href="#${p.id}"><b>${esc(nm(p.id))}</b><br><small>${esc(p.body.slice(0,90))}</small></a>`),
jr=JOBS.filter(j=>j.t.toLowerCase().includes(q)).slice(0,8).map(j=>`<a href="#careers"><b>${esc(j.t)}</b><br><small>${T("careers")} · ${esc(j.c)}</small></a>`);
$("#sr").innerHTML=pr.concat(jr).join("")||`<p class="em">${T("nm")}</p>`};
$("#sr").onclick=e=>{if(e.target.closest("a"))ds.close()};
addEventListener("hashchange",route);setLang(lang);
</script>
</body>
</html>
